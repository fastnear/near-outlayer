[package]
name = "outlayer-contract"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9.0", features = ["legacy", "unit-testing", "unstable"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.21.7"
sha2 = "0.10.8"
hex = "0.4"
bs58 = "0.5"

[dev-dependencies]
near-workspaces = "0.14.1"
tokio = { version = "1.40", features = ["full"] }
# Unit tests sign with a real wallet key: `store_secrets_for` accepts a secret
# only against an ed25519 signature, and a test that fabricated one would be
# testing nothing.
ed25519-dalek = "2.1"
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
